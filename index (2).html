<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Class Chat</title>
    <link rel="stylesheet" href="style.css">

    <!-- Firebase OLD SDK for simple <script> usage -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
</head>
<body>

<div id="channels">
    <button onclick="switchChannel('general')">#general</button>
    <button onclick="switchChannel('games')">#games</button>
</div>

<div id="chat"></div>

<div id="input-area">
    <input id="name" placeholder="Your name">
    <input id="message" placeholder="Type a message..." onkeypress="if(event.key==='Enter') sendMessage()">
    <button onclick="sendMessage()">Send</button>
</div>

<script src="script.js"></script>
</body>
</html>
