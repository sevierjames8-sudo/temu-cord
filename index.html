<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Temu-Cord</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js" defer></script>
</head>
<body>

<div id="login-screen" class="center">
  <h1>Temu-Cord</h1>
  <button id="googleLogin">Sign in with Google</button>
</div>

<div id="app" class="hidden">

  <!-- Sidebar -->
  <div id="sidebar">
      <h2>Temu-Cord</h2>
      <div class="section-title">Channels</div>
      <div id="channels">
        <div class="channel active" data-channel="general"># general</div>
        <div class="channel" data-channel="games"># games</div>
      </div>

      <div class="section-title">Direct Messages</div>
      <div id="dm-list">
        <!-- DMs added dynamically later -->
      </div>

      <div id="user-info">
        <img id="user-pfp">
        <span id="user-name"></span>
        <button id="logout">Logout</button>
      </div>
  </div>

  <!-- Main Chat Area -->
  <div id="chat-area">
    <div id="messages"></div>

    <div id="message-box">
      <input type="text" id="msgInput" placeholder="Send a message...">
      <button id="sendBtn">Send</button>
    </div>
  </div>

</div>

</body>
</html>
